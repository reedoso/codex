name: Verify rejected tool audio
on:
  push:
    branches: [ci/verify-rejected-tool-audio]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: '8388608'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run Codex audio recovery regression tests
        working-directory: codex-rs
        run: cargo +1.99.1 test --locked -p codex-core --test all rejected_tool_audio_does_not_block_follow_up
